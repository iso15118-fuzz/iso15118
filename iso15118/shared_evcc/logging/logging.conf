[loggers]
keys=root,sampleLogger

[handlers]
keys=fileHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=DEBUG
handlers=fileHandler

[logger_sampleLogger]
level=DEBUG
handlers=fileHandler
qualname=sampleLogger
propagate=0

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=sampleFormatter
args=("iso15118.log", "a")

[formatter_sampleFormatter]
format=%(levelname)s    %(asctime)s - %(name)s (%(lineno)d): %(message)s
